<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RustDesk sign-in</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1d2330; --muted:#5b6475; --line:#e2e5ea; --ok:#1a7f37; --bad:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --card:#1d2128; --text:#e6e9ee; --muted:#9aa3b2; --line:#2c323b; --ok:#3fb950; --bad:#f47067; } }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 12vh auto 0; padding: 0 16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; text-align:center; }
  h1 { font-size:1.3rem; margin:0 0 8px; color: {% if ok %}var(--ok){% else %}var(--bad){% endif %}; }
  p { margin:0; color:var(--muted); }
</style>
</head>
<body>
<main><section>
  <h1>{% if ok %}Signed in{% else %}Sign-in failed{% endif %}</h1>
  <p>{{ message }}</p>
</section></main>
</body>
</html>
